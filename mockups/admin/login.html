<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Iniciar sesión — Nexolia Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <img class="logo" src="../../public/nexolia-logo.svg" alt="Nexolia" />
      <div class="portal-label">Admin Portal</div>
      <h1 style="margin-bottom:0.35rem">Iniciar sesión</h1>
      <p class="secondary" style="margin-bottom:1.5rem;font-size:0.9rem">Acceso exclusivo para el equipo Nexolia.</p>

      <form action="dashboard.html" method="get">
        <div class="field">
          <label for="email">Correo electrónico</label>
          <input id="email" name="email" type="email" value="admin@nexolia.com.ar" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" value="••••••••" autocomplete="current-password" required />
        </div>
        <div class="field" style="flex-direction:row;align-items:center;justify-content:space-between;margin-bottom:1.25rem">
          <label style="font-weight:500;display:flex;align-items:center;gap:0.4rem;cursor:pointer">
            <input type="checkbox" checked /> Recordarme
          </label>
          <a href="#" style="font-size:0.85rem">¿Olvidaste tu contraseña?</a>
        </div>
        <button class="btn btn-primary btn-block" type="submit">Entrar</button>
      </form>

      <p class="muted" style="margin-top:1.25rem;font-size:0.8rem;text-align:center">
        También podés continuar con Google (próximamente)
      </p>
      <p style="margin-top:1rem;text-align:center;font-size:0.8rem">
        <a href="../index.html">← Galería de mockups</a>
      </p>
    </div>
  </div>
</body>
</html>
